<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevPad 交互草图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#25282f;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #dce0e8;border-radius:7px;background:white;padding:6px 10px;min-height:32px;color:inherit}button:hover{background:#f0f3f9}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #386fe7;outline-offset:2px}.primary{background:#386fe7;color:white;border-color:#386fe7}.primary:hover{background:#285ac6}.muted{color:#7a818e;font-size:12px}.intro{max-width:1140px;margin:22px auto 14px;padding:0 20px}.intro strong{font-size:20px}.intro p{margin:3px 0}.app{max-width:1100px;height:690px;max-height:calc(100dvh - 110px);min-height:180px;margin:auto;background:white;border:1px solid #dce0e8;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px #26344a0a;display:flex;flex-direction:column}.top{height:52px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #e7e9ee}.top strong{margin-right:10px}.top input{background:#f4f5f8;border:0;border-radius:6px;padding:6px 10px;min-width:80px;width:240px}.spacer{flex:1}.work{min-height:0;flex:1;display:flex;position:relative}.nav{width:148px;flex-shrink:0;background:#f8f9fb;border-right:1px solid #e7e9ee;padding:16px 10px;display:flex;flex-direction:column;gap:8px}.nav button{border:0;text-align:left;background:none}.nav button.active{color:#285ac6;background:#e9effd}.list{width:250px;flex-shrink:0;border-right:1px solid #e7e9ee;display:flex;flex-direction:column;min-height:0}.list-head{display:flex;gap:8px;align-items:center;min-height:52px;padding:10px 14px}.rows{flex:1;min-height:0;overflow:auto}.row{padding:14px;border-bottom:1px solid #edf0f4;display:flex;gap:9px;cursor:pointer}.row.active{background:#f1f5fe}.row input{width:17px;height:17px;flex-shrink:0;margin:4px 0 0}.row strong{display:block;font-weight:550}.row small{color:#818794}.batch{padding:8px 10px;min-height:50px;border-top:1px solid #e7e9ee;display:flex;align-items:center;gap:8px;background:white}.batch[hidden]{display:none}.batch span{white-space:nowrap;font-size:12px}.content{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}.content-head{display:flex;align-items:center;gap:8px;padding:12px 20px;min-height:56px;border-bottom:1px solid #edf0f4}.editor{overflow:auto;flex:1;min-height:0;outline:0;padding:25px 32px;font-size:16px;line-height:1.85;white-space:pre-wrap}.editor h2{font-size:23px;font-weight:600;margin:0 0 14px}.editor:empty:before{content:'记点什么，或粘贴图片…';color:#a2a8b3}.picture{border:1px solid #dce4f6;background:linear-gradient(135deg,#edf3ff,#f4f0fa);height:120px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#5b709d;margin:14px 0;font-size:14px;white-space:normal}.bottom{border-top:1px solid #edf0f4;padding:9px 20px;display:flex;align-items:center;gap:9px;color:#707989;font-size:12px}.status{color:#6d788f;font-size:12px;white-space:nowrap}.task-page{flex:1;overflow:auto;padding:26px;min-width:0}.task-page h2{margin-top:0}.task{border:1px solid #e4e8f0;border-radius:9px;padding:16px;margin:12px 0}.badge{background:#edf1fa;color:#476391;border-radius:4px;padding:3px 7px;font-size:12px}.task strong{display:block;margin:8px 0}.task .result{background:#f7faf6;padding:12px;margin:10px 0}.drawer{position:absolute;inset:0 0 0 auto;width:420px;max-width:100%;background:white;box-shadow:-10px 0 30px #26344a12;border-left:1px solid #e7e9ee;display:flex;flex-direction:column;z-index:2}.drawer[hidden]{display:none}.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #e7e9ee}.drawer-body{padding:20px;flex:1;overflow:auto}.drawer label{display:block;margin:12px 0 4px}.drawer select,.drawer textarea{width:100%;border:1px solid #dce0e8;border-radius:6px;padding:8px;background:white}.drawer textarea{min-height:90px}.preview{white-space:pre-wrap;background:#f7f8fa;border:1px solid #e9edf4;padding:14px;margin:16px 0;font-size:13px}.actions{padding:14px 20px;border-top:1px solid #e7e9ee;display:flex;gap:8px}.toast{min-height:28px;flex-shrink:0;background:#f8f9fb;color:#526078;border-top:1px solid #e7e9ee;padding:4px 12px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast[hidden]{display:none}.back{display:none}.options{position:absolute;bottom:60px;left:158px;background:white;border:1px solid #dce0e8;padding:5px;box-shadow:0 8px 25px #26344a18;border-radius:8px;z-index:3}.options[hidden]{display:none}.options button{display:block;width:180px;border:0;text-align:left}.footer{max-width:1100px;margin:12px auto;padding:0 10px;color:#6e7888;font-size:12px} [hidden]{display:none!important}
@media(max-width:760px){.intro{margin-top:10px}.intro strong{font-size:17px}.app{margin:0 10px;max-height:calc(100dvh - 120px);height:650px}.nav{width:102px}.list{width:210px}.editor{padding:20px}.top input{width:140px}.content-head{padding:10px 14px}.drawer{width:380px}.footer{padding:0 18px}}
@media(max-width:560px){.top{padding:0 10px;gap:8px}.top input{width:100px;flex:1}.top strong{margin-right:0}.nav{width:86px;padding:12px 4px}.nav button{padding:5px;font-size:12px}.list{width:auto;flex:1;border:0}.content{display:none}.work.open-note .list{display:none}.work.open-note .content{display:flex}.back{display:block}.content-head{padding:8px 10px;gap:5px}.content-head .status{font-size:11px}.editor{padding:20px 15px}.bottom{padding:8px 12px}.options{left:90px}.intro p{font-size:12px}.task-page{padding:15px}.task-page h2{font-size:20px}}
</style>
<div class="intro"><strong>DevPad · 交互草图</strong><p class="muted">试试：连续记录 → 多选交付 → 发布任务 → 查看结果。此草图只模拟流程，不读取真实笔记。</p></div>
<div class="app"><header class="top"><strong>DevPad</strong><input id="search" aria-label="搜索笔记" placeholder="搜索笔记"><span class="spacer"></span><button id="new">＋ 新建</button><button id="settings" aria-label="设置与帮助">···</button></header>
<div class="work" id="work"><nav class="nav" aria-label="主导航"><button data-view="notes" class="active">收件箱</button><button data-view="tasks">任务 <span id="task-count">0</span></button><span class="spacer"></span><button id="trash">回收站</button><button id="help">帮助与更新</button></nav>
<section class="list" id="list"><div class="list-head"><strong>笔记</strong><span class="spacer"></span><button id="select">多选</button></div><div class="rows" id="rows"></div><div class="batch" id="batch" hidden><span id="selected-count"></span><span class="spacer"></span><button id="batch-copy">复制</button><button id="more">更多</button><button id="end-select" aria-label="退出多选">×</button></div></section>
<section class="content" id="content"><div class="content-head"><button class="back" id="back">返回</button><span class="status" id="saved" role="status">已保存本地</span><span class="spacer"></span><button id="copy">复制</button><button id="publish">交给 Agent</button></div><div class="editor" id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="笔记正文"></div><footer class="bottom"><button id="add-image">＋ 图片</button><span class="spacer"></span><button id="organize">整理</button></footer></section>
<section class="task-page" id="tasks" hidden><h2>任务</h2><p class="muted">材料快照、领取状态和结果在同一处查看。</p><div id="task-list"></div></section>
<aside class="drawer" id="drawer" aria-label="交付面板" hidden><div class="drawer-head"><strong id="drawer-title">复制与导出</strong><span class="spacer"></span><button id="close-drawer" aria-label="关闭面板">×</button></div><div class="drawer-body" id="drawer-body"></div><div class="actions" id="drawer-actions"></div></aside>
<div class="options" id="options" hidden><button id="batch-publish">交给 Agent</button><button id="batch-move">移动到笔记本</button><button id="batch-delete">移到回收站</button></div></div><div class="toast" id="toast" role="status">本地笔记 · 就绪</div></div><p class="footer">候选方案：主窗内连续编辑 · 稳定的复制入口 · 简短批量栏 · 日常任务与连接设置分开。模拟自动保存只用于演示；正式实现需保留私有草稿与 MCP 的读取边界。</p>
<script>
const $=id=>document.getElementById(id);let notes=[{id:1,body:'<h2>这段图文资料要一起交付</h2><div>先说明这个界面的操作问题。</div><div class="picture" contenteditable="false">示例图片 1 · 操作区域</div><div>再对照另一张图片，说明理想行为。</div><div class="picture" contenteditable="false">示例图片 2 · 参考区域</div><div>图片和说明保持当前位置。</div>'},{id:2,body:'<h2>随手记一个想法</h2><div>先写下来，需要时再整理到笔记本。</div>'},{id:3,body:'<h2>值得继续研究的交互</h2><div>保存、复制、批量选择和结果查看，需要连贯。</div>'}],active=1,selection=[],selecting=false,tasks=[],deleted=[],saveTimer,toastTimer,scope=[];
function plain(n){const el=document.createElement('div');el.innerHTML=n.body;return el.innerText||el.textContent||''}function title(n){const el=document.createElement('div');el.innerHTML=n.body;return (el.querySelector('h2')?.textContent||el.textContent||'新笔记').slice(0,30)}function message(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='本地笔记 · 就绪',2600)}
function renderRows(){const query=$('search').value.toLowerCase();$('rows').replaceChildren();for(const n of notes.filter(n=>plain(n).toLowerCase().includes(query))){const r=document.createElement('div');r.className='row'+(n.id===active?' active':'');if(selecting){const c=document.createElement('input');c.type='checkbox';c.checked=selection.includes(n.id);c.setAttribute('aria-label','选择 '+title(n));c.onclick=e=>{e.stopPropagation();selection=c.checked?[...selection,n.id]:selection.filter(id=>id!==n.id);renderRows()};r.append(c)}const t=document.createElement('div'),head=document.createElement('strong'),sub=document.createElement('small');head.textContent=title(n);sub.textContent='保存在本地';t.append(head,sub);r.append(t);r.onclick=()=>{active=n.id;$('editor').innerHTML=n.body;$('work').classList.add('open-note');renderRows()};$('rows').append(r)}$('batch').hidden=!selecting;$('select').textContent=selecting?'退出':'多选';$('selected-count').textContent='已选 '+selection.length+' 条';$('batch-copy').disabled=$('more').disabled=!selection.length}
function view(name){for(const button of document.querySelectorAll('[data-view]'))button.classList.toggle('active',button.dataset.view===name);$('list').hidden=$('content').hidden=name!=='notes';$('tasks').hidden=name!=='tasks';$('work').classList.remove('open-note');closeDrawer();renderTasks()}
function closeDrawer(){$('drawer').hidden=true;$('options').hidden=true}function setDrawer(title){$('drawer-title').textContent=title;$('drawer-body').replaceChildren();$('drawer-actions').replaceChildren();$('drawer').hidden=false;$('options').hidden=true}function action(text,fn,primary=false){const b=document.createElement('button');b.textContent=text;b.className=primary?'primary':'';b.onclick=fn;$('drawer-actions').append(b)}function chosen(){return selection.length?[...selection]:[active]}
function copyPanel(ids){scope=[...ids];setDrawer('复制与导出');$('drawer-body').innerHTML='<p id="range"></p><label for="order">内容顺序</label><select id="order"><option value="list">列表顺序</option><option value="click">点击选择顺序</option></select><label for="template">输出模板</label><select id="template"><option value="source">原文</option><option value="discussion">讨论分析</option><option value="engineering">工程任务</option></select><div class="preview" id="preview"></div><p class="muted">先确认文字与图片。不同目标输入框支持的粘贴格式可能不同。</p>';$('range').textContent='本次范围：'+scope.length+' 条笔记';function preview(){const picked=$('order').value==='list'?notes.filter(n=>scope.includes(n.id)):scope.map(id=>notes.find(n=>n.id===id));$('preview').replaceChildren();if($('template').value!=='source'){const p=document.createElement('p');p.textContent=$('template').value==='engineering'?'请根据以下内容实施修改，并说明验证结果：':'请根据以下资料进行分析：';$('preview').append(p)}for(const n of picked){const p=document.createElement('div');p.innerHTML=n.body;$('preview').append(p)}}$('order').onchange=$('template').onchange=preview;preview();action('仅正文',()=>message('演示：已准备 '+scope.length+' 条正文'));action('复制图文',()=>{const count=scope.reduce((sum,id)=>{const el=document.createElement('div');el.innerHTML=notes.find(n=>n.id===id).body;return sum+el.querySelectorAll('.picture').length},0);message('演示：已准备 '+scope.length+' 条正文和 '+count+' 张图片')},true);action('完整导出',()=>message('演示：完整包包含正文、全部图片和对应顺序'))}
function publishPanel(ids){scope=[...ids];setDrawer('交给 Agent');$('drawer-body').innerHTML='<p id="materials"></p><label for="instructions">希望 Agent 完成什么？</label><textarea id="instructions" placeholder="说明目的和验收方式（可选）"></textarea><p class="muted">发布的是当前材料快照。后续修改笔记不改变这个任务；Agent 主动领取后才开始处理。</p>';$('materials').textContent='材料：'+scope.map(id=>title(notes.find(n=>n.id===id))).join('、');action('返回编辑',closeDrawer);action('加入任务队列',()=>{tasks.unshift({id:Date.now(),title:$('instructions').value||'分析选中的 '+scope.length+' 条材料',state:0,records:scope.map(id=>title(notes.find(n=>n.id===id)))});selection=[];selecting=false;renderRows();view('tasks');message('已加入队列，等待 Agent 领取')},true)}
function renderTasks(){$('task-count').textContent=tasks.length;$('task-list').replaceChildren();if(!tasks.length){const p=document.createElement('p');p.textContent='从笔记或多选栏选择“交给 Agent”。';$('task-list').append(p)}for(const t of tasks){const el=document.createElement('article');el.className='task';const tag=document.createElement('span');tag.className='badge';tag.textContent=['等待领取','处理中 · 示例 Agent','已完成','已撤回'][t.state];const h=document.createElement('strong');h.textContent=t.title;const p=document.createElement('p');p.className='muted';p.textContent='材料快照：'+t.records.join('、');el.append(tag,h,p);if(t.state<2){const b=document.createElement('button');b.textContent=t.state===0?'模拟 Agent 领取':'模拟 Agent 写回结果';b.onclick=()=>{t.state++;renderTasks()};el.append(b);const cancel=document.createElement('button');cancel.textContent='撤回';cancel.onclick=()=>{t.state=3;renderTasks();message('任务已撤回，当前领取凭证失效')};el.append(cancel)}if(t.state===2){const r=document.createElement('div');r.className='result';r.textContent='完成结果：已分析图文材料，指出流程中的重复入口和反馈问题。验证说明与结果保存在任务中。';el.append(r)}$('task-list').append(el)}}
$('editor').oninput=()=>{const n=notes.find(n=>n.id===active);n.body=$('editor').innerHTML;$('saved').textContent='正在保存…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{$('saved').textContent='已保存本地';renderRows()},450)};$('editor').onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))};$('editor').innerHTML=notes[0].body;
$('new').onclick=()=>{view('notes');active=Date.now();notes.unshift({id:active,body:''});$('editor').innerHTML='';$('work').classList.add('open-note');renderRows();$('editor').focus()};$('search').oninput=renderRows;$('select').onclick=()=>{selecting=!selecting;selection=[];renderRows()};$('end-select').onclick=()=>{selecting=false;selection=[];renderRows()};$('back').onclick=()=>$('work').classList.remove('open-note');$('copy').onclick=()=>copyPanel([active]);$('batch-copy').onclick=()=>copyPanel(chosen());$('publish').onclick=()=>publishPanel([active]);$('batch-publish').onclick=()=>publishPanel(chosen());$('close-drawer').onclick=closeDrawer;$('more').onclick=()=>$('options').hidden=!$('options').hidden;$('batch-move').onclick=()=>{closeDrawer();message('演示：所选笔记已移动，可继续查看目标笔记本')};$('batch-delete').onclick=()=>{deleted=notes.filter(n=>selection.includes(n.id));notes=notes.filter(n=>!selection.includes(n.id));selection=[];renderRows();closeDrawer();message('已移到回收站；点击“回收站”可以恢复')};$('trash').onclick=()=>{notes.push(...deleted);deleted=[];renderRows();message('演示：回收站里的内容已恢复')};$('organize').onclick=()=>message('在这里按需设置笔记本、标签和工程类型');$('settings').onclick=$('help').onclick=()=>{setDrawer('设置、帮助与更新');$('drawer-body').innerHTML='<h3>按需设置</h3><p>外观与窗口</p><p>导出模板</p><p>Agent 连接</p><p>数据与备份</p><hr><h3>帮助与更新</h3><p>说明保存在应用内，更新沿用安装位置。</p>';action('检查并更新',()=>message('演示：当前已是最新版本'))};
$('add-image').onclick=()=>{const editor=$('editor');editor.focus();const picture=document.createElement('div');picture.className='picture';picture.contentEditable='false';picture.textContent='新图片 · 插入当前位置';const selection=window.getSelection();if(selection.rangeCount&&editor.contains(selection.anchorNode)){const range=selection.getRangeAt(0);range.deleteContents();range.insertNode(picture);range.setStartAfter(picture);range.collapse(true);selection.removeAllRanges();selection.addRange(range)}else editor.append(picture);editor.dispatchEvent(new Event('input'))};for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>view(b.dataset.view);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('options').hidden){$('options').hidden=true;return}if(!$('drawer').hidden){closeDrawer();return}if(selecting){selecting=false;selection=[];renderRows()}}});renderRows();
</script></html>
