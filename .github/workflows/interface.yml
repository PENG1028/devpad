name: Interface and languages
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:headless
